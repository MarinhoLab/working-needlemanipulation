name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # quadprog is a declared runtime dependency; dqrobotics imports its
          # DQ_QuadprogSolver wrapper inside a bare try/except, so the
          # concrete solver silently disappears without it.
          pip install pytest numpy pyyaml termcolor dqrobotics quadprog
      - name: Run tests
        run: |
          PYTHONPATH=".:$PYTHONPATH" pytest tests/ -v

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Init submodules
        run: |
          git submodule update --init --recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Ubuntu dependencies ──────────────────────────────────────
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev build-essential
      - name: Cache CMake build (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-cmake-${{ matrix.python-version }}-${{ hashFiles('CMakeLists.txt', 'src/*.cpp', 'include/*.h') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.python-version }}-
      - name: Cache pip (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      # ── Windows dependencies ─────────────────────────────────────
      - name: Install compilation dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          vcpkg integrate install
          vcpkg install eigen3:x64-windows
          cmd /c mklink /d c:\Tools\vcpkg c:\vcpkg 2>$null || true
          cd ~
      - name: Cache pip (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      # ── Build ────────────────────────────────────────────────────
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel
        run: |
          python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-py${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
